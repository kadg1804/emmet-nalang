<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <label for="student-id">Student ID:</label>
        <input type="text" name="students_id" id="student-id">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="emal" name="email">
        <br><br>

        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
        <label for="Gender:"></label>
        <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="Course">Course:</label>
        <select name="course" id="course">
            <option value="">-- Select Course--</option>
            <option value="BSIT">Bachelor of Science Information Technoloy</option>
            <option value="BSCS">Bachelor of Computer Science</option>
            <option value="BSMA">Bachelor of Multimedia Arts</option>
        </select>
        <br><br>

        <label for="Hobbies:"></label>
        <br>

        <input type="checkbox" id="reading" name="Hobbies" value="reading">
        <label for="reading">Reading</label>

        <input type="checkbox" id="gaming" name="Hobbies" value="gaming">
        <label for="gaming">Gaming</label>

        <input type="checkbox" id="sports" name="Hobbies" value="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music" name="Hobbies" value="music">
        <label for="music">Music</label>

        <br><br>
        <label for="Address">Address</label>
        <br>
        <textarea name="address" id="Address"></textarea>

        <br><br>
        <input type="submit" value="Submit">

    </form>
</body>
</html>
